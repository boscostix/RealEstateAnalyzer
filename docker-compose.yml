version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HASDATA_API_KEY: ${HASDATA_API_KEY:-}
      HASDATA_API_KEY_FILE: ${HASDATA_API_KEY_FILE:-/app/secrets/hasdata_api_key.txt}
      ZILLOW_USE_HASDATA: ${ZILLOW_USE_HASDATA:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-gpt-5-mini}
      OPENAI_AGENT_PROMPT_VERSION: ${OPENAI_AGENT_PROMPT_VERSION:-v1}
      OPENAI_AGENT_MAX_TURNS: ${OPENAI_AGENT_MAX_TURNS:-6}
      OPENAI_AGENT_TIMEOUT_SECONDS: ${OPENAI_AGENT_TIMEOUT_SECONDS:-30.0}
      OPENAI_AGENT_WORKFLOW_TIMEOUT_SECONDS: ${OPENAI_AGENT_WORKFLOW_TIMEOUT_SECONDS:-90.0}
      OPENAI_AGENT_MAX_PARALLEL_AGENTS: ${OPENAI_AGENT_MAX_PARALLEL_AGENTS:-4}
      OPENAI_AGENT_RETRY_ATTEMPTS: ${OPENAI_AGENT_RETRY_ATTEMPTS:-1}
      OPENAI_AGENT_TRACING_ENABLED: ${OPENAI_AGENT_TRACING_ENABLED:-true}
      OPENAI_AGENT_WORKFLOW_NAME: ${OPENAI_AGENT_WORKFLOW_NAME:-real_estate_agent_research}
      OPENAI_AGENT_TRACE_SENSITIVE_DATA: ${OPENAI_AGENT_TRACE_SENSITIVE_DATA:-false}
